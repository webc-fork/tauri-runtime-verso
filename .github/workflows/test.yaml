name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
          # There is no prebuilt versoview for aarch64 linux yet, so the helloworld example,
          # which downloads it in its build script, has to be excluded there
          - platform: ubuntu-24.04-arm
            no_prebuilt_versoview: true
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace ${{ matrix.no_prebuilt_versoview && '--exclude helloworld' || '' }} --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace ${{ matrix.no_prebuilt_versoview && '--exclude helloworld' || '' }}

      - name: Build Hello World example
        if: matrix.no_prebuilt_versoview != true
        run: cargo build --package helloworld
