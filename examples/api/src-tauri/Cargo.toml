[package]
name = "api"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-runtime-verso-build = { path = "../../../tauri-runtime-verso-build" }
tauri-build = { version = "~3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "~3.0.0-alpha.4", default-features = false, features = [
    # Default features
    # "compression",
    "common-controls-v6",
    # "dynamic-acl",
    # Additional features
    "tray-icon",
] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "~3.0.0-alpha.2"
tauri-plugin-opener = "~3.0.0-alpha.2"
tauri-runtime-verso = { path = "../../../" }
